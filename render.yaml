services:
  - type: web
    name: iot-lab3-mask
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ORT_THREADS
        value: "1"
      - key: MODEL_PATH
        value: assets/model.onnx
      - key: ALERTS_ENABLED
        value: "0"
      - key: ALERT_COOLDOWN_SECONDS
        value: "30"
